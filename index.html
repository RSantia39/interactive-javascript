<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Example</title>
  </head>
  <body>
    <h1>Interactive Example</h1>
    <h2>Section 1 Lessons</h2>
    <button id="menuBtn">Toggle Menu</button>
    <ul id="menu" style="display: none; text-decoration: none">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button id="alertBtn">Show Alert</button>
    <button id="incrementBtn">Increment Counter</button>
    <button id="decrementBtn">Decrement Counter</button>
    <button id="resetBtn">Reset</button>
    <p>Counter: <span id="counter">0</span></p>

    <label for="username">Enter your username:</label>
    <input
      type="text"
      id="username"
      name="username"
      placeholder="Your Username"
    />
    <button type="button" id="greetBtn">Greet Me</button>
    <p id="greeting"></p>
    <button id="addParagraphBtn">Add Paragraph</button>
    <div id="paragraphContainer"></div>

    <script src="js/script.js"></script>
  </body>
</html>
